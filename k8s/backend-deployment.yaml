# SecureAssist backend (port 8092)
# STUDENT TASK (Task 4): complete the env, probes and securityContext. Reference solution below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureassist-backend
  namespace: secureassist
  labels:
    app.kubernetes.io/name: secureassist-backend
    app.kubernetes.io/part-of: secureassist
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120        # a broken rollout is reported within 2 minutes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0               # keep the old Pod serving until the new one is Ready
  selector:
    matchLabels:
      app.kubernetes.io/name: secureassist-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secureassist-backend
        app.kubernetes.io/part-of: secureassist
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: secureassist-backend:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8092
          env:
            # MCP server through its Kubernetes Service
            - name: MCP_SERVER_URL
              value: "http://secureassist-mcp:8093/mcp"
            - name: MCP_TIMEOUT
              value: "10"
            # EXISTING Ollama on the VM, reached from inside Minikube.
            # Confirm with: scripts/check-environment.sh (section "Ollama from Minikube")
            - name: OLLAMA_URL
              value: "http://host.minikube.internal:11434"
            - name: OLLAMA_MODEL
              value: "phi3:mini"
            - name: OLLAMA_READ_TIMEOUT
              value: "120"
            - name: MAX_PROMPT_CHARS
              value: "1000"
            # Langfuse runs in this namespace: reached through its Kubernetes Service.
            # Keys come from the Secret secureassist-langfuse (never in YAML); optional, so
            # the chatbot still starts if the Secret is missing.
            - name: LANGFUSE_HOST
              value: "http://secureassist-langfuse:3031"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: secureassist-langfuse, key: LANGFUSE_PUBLIC_KEY, optional: true }
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: secureassist-langfuse, key: LANGFUSE_SECRET_KEY, optional: true }
            - name: HOME
              value: /tmp
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:                 # config valid + MCP Service name resolves
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:                  # process is alive
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
