# PREDEFINED. In-cluster DNS name: secureassist-langfuse:3031 (used by the backend).
# Browser access: kubectl -n secureassist port-forward --address 0.0.0.0 svc/secureassist-langfuse 3031:3031
apiVersion: v1
kind: Service
metadata:
  name: secureassist-langfuse
  namespace: secureassist
  labels:
    app.kubernetes.io/name: secureassist-langfuse
    app.kubernetes.io/part-of: secureassist
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: secureassist-langfuse
  ports:
    - name: http
      port: 3031        # Service port
      targetPort: http  # container port 3000
