# SonarQube analysis settings for SecureAssist (PREDEFINED)
# Used by Jenkins stage 4 (sonar-scanner inside withSonarQubeEnv).
# The server URL and token are NEVER stored here: Jenkins injects them
# (SONAR_HOST_URL / SONAR_AUTH_TOKEN) from its SonarQube server configuration.
sonar.projectKey=secureassist
sonar.projectName=SecureAssist - Enterprise AI Helpdesk
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=app/backend,app/frontend,mcp_server,langfuse/Dockerfile
sonar.exclusions=**/__pycache__/**

sonar.python.version=3.12
# This project ships no automated test files, so no coverage report is imported.
# Use a quality gate without a coverage condition (see docs/troubleshooting.md).
