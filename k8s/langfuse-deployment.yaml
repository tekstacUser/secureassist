# PREDEFINED - Langfuse (web UI + API) built from langfuse/Dockerfile
#   docker build -t secureassist-langfuse:1.0 langfuse
#   minikube image load secureassist-langfuse:1.0 --overwrite=true
# Needs the Secret secureassist-langfuse (created from langfuse/.env) BEFORE it starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureassist-langfuse
  namespace: secureassist
  labels:
    app.kubernetes.io/name: secureassist-langfuse
    app.kubernetes.io/part-of: secureassist
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 420        # first start runs database migrations
  selector:
    matchLabels:
      app.kubernetes.io/name: secureassist-langfuse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secureassist-langfuse
        app.kubernetes.io/part-of: secureassist
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001               # "nextjs" user of the Langfuse image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: langfuse
          image: secureassist-langfuse:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            # Database through its Kubernetes Service (the entrypoint builds DATABASE_URL)
            - name: DATABASE_HOST
              value: "secureassist-langfuse-db:5432"
            - name: DATABASE_USERNAME
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: POSTGRES_USER } }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: POSTGRES_PASSWORD } }
            - name: DATABASE_NAME
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: POSTGRES_DB } }
            # Address used in the browser (through: port-forward 3031)
            - name: NEXTAUTH_URL
              value: "http://localhost:3031"
            - name: NEXTAUTH_SECRET
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: NEXTAUTH_SECRET } }
            - name: SALT
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: SALT } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: ENCRYPTION_KEY } }
            # Created once on first start: organisation, project, these API keys, admin user
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: LANGFUSE_PUBLIC_KEY } }
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: LANGFUSE_SECRET_KEY } }
            - name: LANGFUSE_INIT_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: secureassist-langfuse, key: LANGFUSE_INIT_USER_PASSWORD } }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:                 # up to 5 minutes for migrations on first start
            httpGet: { path: /api/public/health, port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/public/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/public/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
