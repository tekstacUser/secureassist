# PREDEFINED reference manifest - SecureAssist MCP server (port 8093)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureassist-mcp
  namespace: secureassist
  labels:
    app.kubernetes.io/name: secureassist-mcp
    app.kubernetes.io/part-of: secureassist
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: secureassist-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secureassist-mcp
        app.kubernetes.io/part-of: secureassist
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: secureassist-mcp:1.0
          imagePullPolicy: Never          # image is loaded into Minikube with `minikube image load`
          ports:
            - name: http
              containerPort: 8093
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8093"
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
